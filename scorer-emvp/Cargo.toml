[package]
name = "scorer-emvp"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
# Pulls cudarc and triggers the build.rs nvcc → PTX
# compilation step for the custom Mersenne block-GEMV kernel. CPU-only
# builds (default) skip both: cudarc is optional, build.rs short-circuits
# when CARGO_FEATURE_GPU is unset.
# Also pulls `scorer-gpu-common` for the streaming
# ClusterStore + NVML peak sampler. No `cuvs-sys` here — EMVP's GPU
# path is cudarc-only, so cluster device memory is owned by
# `CudaSlice<u64>` and freed automatically on Drop (no equivalent of
# the cuvs dataset-lifetime leak the cuVS-backed scorers work
# around).
gpu = ["dep:cudarc", "dep:scorer-gpu-common", "scorer-gpu-common/cuda"]

[dependencies]
scorer-core  = { workspace = true }
ivf-index    = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
tokio        = { workspace = true }
rand         = { workspace = true }
rand_chacha  = { workspace = true }
rayon        = { workspace = true }
memmap2      = { workspace = true }
cudarc       = { workspace = true, optional = true }
scorer-gpu-common = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
